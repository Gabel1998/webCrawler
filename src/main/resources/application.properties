# ============================================
# DATABASE CONFIGURATION
# ============================================
spring.datasource.url=jdbc:mysql://localhost:3306/webcrawler_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=crawler
spring.datasource.password=crawlerpass
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================================
# JPA/HIBERNATE CONFIGURATION
# ============================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ============================================
# SERVER CONFIGURATION
# ============================================
server.port=8080

# ============================================
# CRAWLER SETTINGS
# ============================================
app.crawler.default-timeout=10000
app.crawler.user-agent=WebCrawler/1.0
app.output.directory=./output

# Groq AI API
groq.api.key=${GROQ_API_KEY:}
groq.api.url=${GROQ_API_URL:https://api.groq.com/openai/v1/chat/completions}
groq.api.model=${GROQ_API_MODEL:llama-3.3-70b-versatile}

# Selenium (empty = use local ChromeDriver)
selenium.remote.url=${SELENIUM_REMOTE_URL:}