# Showroom mode — H2 in-memory, Selenium via remote Chrome
spring.datasource.url=jdbc:h2:mem:webcrawler_showroom;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create
spring.jpa.properties.hibernate.dialect=
spring.jpa.show-sql=false

# Selenium remote (selenium/standalone-chrome container)
selenium.remote.url=${SELENIUM_REMOTE_URL:http://selenium-chrome:4444/wd/hub}

# Groq AI API
groq.api.key=${GROQ_API_KEY:}
groq.api.url=https://api.groq.com/openai/v1/chat/completions
groq.api.model=llama-3.3-70b-versatile
